<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="agywe-token" content="__AGYWE_TOKEN__">
<title>快速切换壁纸</title>
<style>
  :root { color-scheme: dark; --acc: #8fb4ff; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font: 13px/1.4 "Microsoft YaHei UI", "Segoe UI", sans-serif; color: #eef1f8; }
  #bg { position: fixed; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.5), rgba(0,0,0,.12) 55%, rgba(0,0,0,0)); animation: fade .2s ease; }
  #qs { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); width: min(1120px, calc(100vw - 48px)); box-sizing: border-box; padding: 14px 16px 10px; border-radius: 18px;
    background: rgba(22,25,34,.74); -webkit-backdrop-filter: blur(22px) saturate(1.3); backdrop-filter: blur(22px) saturate(1.3);
    box-shadow: 0 18px 60px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.1); animation: up .24s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes up { from { opacity: 0; translate: 0 24px; } to { opacity: 1; translate: 0 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .top { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .tabs { display: flex; gap: 4px; }
  .tabs button, .top .act { padding: 6px 11px; border-radius: 9px; border: 0; background: rgba(255,255,255,.07); color: inherit; font: inherit; cursor: pointer; }
  .tabs button:hover, .top .act:hover { background: rgba(255,255,255,.14); }
  .tabs button.on { background: var(--acc); color: #0d1018; font-weight: 600; }
  #q { flex: 1; min-width: 0; padding: 7px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.07); color: inherit; font: inherit; outline: none; }
  #q:focus { border-color: var(--acc); }
  #strip { display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; padding: 6px 4px 12px; scroll-behavior: smooth; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.25) transparent; }
  .card { flex: 0 0 auto; width: 170px; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,.05); cursor: pointer; position: relative; outline: 2px solid transparent; outline-offset: 1px; transition: transform .12s, outline-color .12s; }
  .card img, .card .ph { width: 170px; height: 96px; object-fit: cover; display: block; background: rgba(255,255,255,.06); }
  .card .ph { display: grid; place-items: center; font-size: 26px; }
  .card .t { padding: 5px 8px 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  .card .b { position: absolute; top: 5px; left: 5px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.55); font-size: 11px; }
  .card .f { position: absolute; top: 3px; right: 6px; font-size: 15px; color: #ffd34d; text-shadow: 0 1px 3px #000; }
  .card.sel { outline-color: var(--acc); transform: translateY(-3px); }
  .card.cur .t::before { content: "● "; color: var(--acc); }
  .empty { padding: 34px 10px; text-align: center; color: rgba(238,241,248,.6); width: 100%; }
  .hint { color: rgba(238,241,248,.55); font-size: 12px; display: flex; justify-content: space-between; gap: 10px; }
  kbd { padding: 0 5px; border-radius: 4px; background: rgba(255,255,255,.12); font: 11px Consolas, monospace; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="qs" role="dialog" aria-label="快速切换壁纸">
  <div class="top">
    <div class="tabs"><button data-v="fav">★ 收藏</button><button data-v="recent">最近</button><button data-v="all">全部</button></div>
    <input id="q" placeholder="输入名字筛选…" autocomplete="off" spellcheck="false">
    <button class="act" id="rand" title="随机换一张">🎲 随机</button>
    <button class="act" id="close" title="关闭（Esc）">✕</button>
  </div>
  <div id="strip"></div>
  <div class="hint"><span><kbd>←</kbd> <kbd>→</kbd> 选　<kbd>Home</kbd>/<kbd>End</kbd> 头尾　<kbd>Enter</kbd> 换上　<kbd>Shift</kbd>+<kbd>Enter</kbd> 换上不关　<kbd>Ctrl</kbd>+<kbd>D</kbd> 收藏　<kbd>Alt</kbd>+<kbd>1</kbd>~<kbd>3</kbd> / <kbd>Tab</kbd> 切分类　<kbd>Alt</kbd>+<kbd>R</kbd> 随机　<kbd>Esc</kbd> 关闭</span><span id="info"></span></div>
</div>
<script src="parent-link.js"></script>
<script src="quick.js"></script>
</body>
</html>
